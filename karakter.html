<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SkillSpark - E-Course Generus</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif;-webkit-tap-highlight-color:transparent}
  :root{
    --primary:#00A8FF;--primary-light:#E6F6FF;--primary-dark:#0084C7;
    --text-dark:#1E1E1E;--text-gray:#888;--bg-body:#F5F7FA;--white:#FFF;
    --danger:#FF4757;--success:#2ED573;
    --radius-md:16px;--radius-lg:24px;--radius-pill:50px;
    --shadow:0 8px 24px rgba(0,168,255,.15);
  }
  html,body{height:100%}
  body{background:var(--bg-body);color:var(--text-dark);display:flex;justify-content:center;min-height:100vh}
  .app-container{
    width:100%;max-width:520px;background:var(--white);min-height:100vh;position:relative;
    box-shadow:0 0 40px rgba(0,0,0,.05);display:flex;flex-direction:column
  }
  @media(min-width:768px){
    body{padding:24px;align-items:center}
    .app-container{min-height:calc(100vh - 48px);max-height:calc(100vh - 48px);border-radius:24px;overflow:hidden}
  }
  .icon{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .icon-sm{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .icon-lg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

  /* LOGIN */
  #view-login{padding:32px 24px;display:flex;flex-direction:column;justify-content:center;min-height:100vh;text-align:center}
  @media(min-width:768px){#view-login{min-height:auto;flex:1}}
  .login-image-container{width:100%;height:180px;margin-bottom:20px;display:flex;justify-content:center;align-items:center}
  .login-image-container img{max-width:100%;max-height:100%;object-fit:contain}
  #view-login h1{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:8px}
  #view-login p{font-size:13px;color:var(--text-gray);margin-bottom:24px;line-height:1.6}
  .input-group{text-align:left;margin-bottom:14px}
  .input-group label{display:block;font-size:12px;font-weight:600;margin-bottom:6px;margin-left:4px}
  .input-group input{width:100%;padding:14px 18px;border:1.5px solid #EFEFEF;border-radius:var(--radius-md);font-size:14px;background:#F9F9F9;transition:.2s}
  .input-group input:focus{border-color:var(--primary);background:#FFF;outline:none}
  .btn-primary{
    width:100%;padding:14px;background:var(--primary);color:#FFF;border:none;border-radius:var(--radius-pill);
    font-size:15px;font-weight:600;cursor:pointer;box-shadow:var(--shadow);transition:.2s;
    display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px
  }
  .btn-primary:active{transform:scale(.98)}
  .btn-primary:disabled{opacity:.7;cursor:not-allowed}

  /* APP */
  #view-app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  @media(min-width:768px){#view-app{height:calc(100vh - 48px)}}
  .header{padding:20px 20px 8px 20px;display:flex;justify-content:space-between;align-items:center}
  .header-title{font-size:20px;font-weight:700;margin-top:2px}
  .header-sub{font-size:12px;color:var(--text-gray)}
  .avatar-btn{width:42px;height:42px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary);cursor:pointer;border:none;flex-shrink:0}
  #tabContent{flex:1;overflow-y:auto;padding:14px 20px 100px 20px;-webkit-overflow-scrolling:touch}

  /* MATERI */
  .materi-grid{display:flex;flex-direction:column;gap:12px}
  .materi-card-item{background:var(--white);border-radius:var(--radius-lg);padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1.5px solid #F0F0F0;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.15s}
  .materi-card-item:hover{border-color:var(--primary);transform:translateY(-1px)}
  .materi-card-item:active{transform:scale(.98)}
  .materi-icon-box{width:46px;height:46px;border-radius:14px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}
  .materi-icon-box svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none}
  .materi-info{flex:1;min-width:0}
  .materi-info h4{font-size:14px;font-weight:600;margin-bottom:3px;color:var(--text-dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .materi-info p{font-size:12px;color:var(--text-gray);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .arrow-icon{color:#CCC;width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;flex-shrink:0}

  /* DETAIL */
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:none;border:none;color:var(--primary);font-size:13px;font-weight:600;cursor:pointer;margin-bottom:14px;padding:4px 0}
  .course-card{background:linear-gradient(135deg,#00D2FF 0%,#00A8FF 100%);border-radius:var(--radius-lg);padding:22px;color:#FFF;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .course-card::after{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;background:rgba(255,255,255,.1);border-radius:50%}
  .course-card .tag{background:rgba(255,255,255,.2);padding:5px 11px;border-radius:var(--radius-pill);font-size:10px;display:inline-block;margin-bottom:10px}
  .course-card h3{font-size:19px;margin-bottom:6px;font-weight:600;position:relative;z-index:1}
  .white-card{background:var(--white);border-radius:var(--radius-lg);padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(0,0,0,.04);border:1px solid #F0F0F0}
  .white-card h4{font-size:14px;margin-bottom:10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .white-card p{font-size:13px;color:var(--text-gray);line-height:1.6;text-align:justify}
  .video-container{border-radius:12px;overflow:hidden;margin:10px 0;aspect-ratio:16/9;background:#000}
  .video-container iframe{width:100%;height:100%;border:none}

  .praktik-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px;border-radius:12px;overflow:hidden}
  .praktik-table th{background:#F8F9FA;padding:9px;text-align:left;border-bottom:1px solid #EEE;font-size:11px}
  .praktik-table td{padding:9px;border-bottom:1px solid #EEE;vertical-align:top}
  .praktik-table td.salah{color:var(--danger);background:#FFF5F5}
  .praktik-table td.benar{color:var(--success);background:#F0FFF4}

/* Dalil vertikal: Arab di atas, arti di bawah */
.dalil-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.dalil-card{
  background:#F8FBFF;border:1px solid #E6F2FF;border-radius:14px;
  padding:14px 16px;position:relative
}
.dalil-card .dalil-num{
  position:absolute;top:-8px;left:12px;
  background:var(--primary);color:#FFF;
  font-size:10px;font-weight:700;
  padding:2px 8px;border-radius:var(--radius-pill)
}
.dalil-card .dalil-arab{
  text-align:right;direction:rtl;
  font-size:20px;line-height:2;
  font-family:'Traditional Arabic','Amiri',serif;
  color:var(--text-dark);padding:6px 0;
  word-wrap:break-word
}
.dalil-card .dalil-divider{
  height:1px;background:linear-gradient(90deg,transparent,#D6E9F8,transparent);
  margin:10px 0
}
.dalil-card .dalil-arti{
  font-size:12.5px;color:var(--text-gray);
  font-style:italic;line-height:1.7;text-align:left
}
.dalil-card .dalil-arti::before{
  content:'"';color:var(--primary);font-weight:700;
  font-style:normal;margin-right:2px
}
.dalil-card .dalil-arti::after{
  content:'"';color:var(--primary);font-weight:700;
  font-style:normal;margin-left:2px
}

  .font-control{display:flex;gap:6px;align-items:center;margin-bottom:6px;justify-content:flex-end}
  .font-control span{font-size:10px;color:var(--text-gray)}

  .eval-section{margin-top:14px;padding-top:14px;border-top:1.5px dashed #EEE}
  .eval-section select{width:100%;padding:11px 14px;border:1.5px solid #EFEFEF;border-radius:12px;font-size:13px;background:#F9F9F9;margin-bottom:10px;appearance:none}
  .eval-list{display:flex;flex-direction:column;gap:6px}
  .eval-item{display:flex;justify-content:space-between;align-items:center;background:#F8F9FA;padding:9px 12px;border-radius:12px;gap:8px}
  .eval-item .name{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .eval-item .actions{display:flex;gap:5px;flex-shrink:0}
  .btn-sm{padding:6px 10px;border:none;border-radius:var(--radius-pill);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:3px}
  .btn-sudah{background:var(--success);color:#FFF}
  .btn-belum{background:#FFEAA7;color:#D63031}
  .btn-outline{background:transparent;border:1px solid #DDD;color:var(--text-gray)}

  .progress-bar{background:#EEE;border-radius:10px;height:8px;margin-top:6px;overflow:hidden}
  .progress-fill{height:100%;background:var(--primary);border-radius:10px;transition:width .4s ease}

  /* BOTTOM NAV */
  .bottom-nav{
    position:absolute;bottom:16px;left:16px;right:16px;background:var(--white);border-radius:var(--radius-pill);
    display:flex;justify-content:space-around;align-items:center;padding:10px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);border:1px solid #F0F0F0;z-index:10
  }
  .bottom-nav button{background:none;border:none;color:var(--text-gray);cursor:pointer;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:.2s;position:relative;flex:1}
  .bottom-nav button span{font-size:10px;font-weight:500}
  .bottom-nav button.active{color:var(--primary)}
  .bottom-nav button.active::after{content:'';position:absolute;bottom:2px;width:4px;height:4px;background:var(--primary);border-radius:50%}

  /* TOAST & UTILS */
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text-dark);color:#FFF;padding:12px 22px;border-radius:var(--radius-pill);font-size:13px;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15);animation:fadeInDown .3s ease;max-width:90vw}
  .toast.error{background:var(--danger)}
  @keyframes fadeInDown{from{top:-50px;opacity:0}to{top:20px;opacity:1}}
  .hidden{display:none!important}
  .spinner{display:inline-block;width:24px;height:24px;border:3px solid #f3f3f3;border-top:3px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:10px}
  @keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

  .form-control{width:100%;padding:12px 15px;border:1.5px solid #E0E0E0;border-radius:12px;font-size:13px;margin-bottom:10px;background:#FAFAFA}
  .form-control:focus{border-color:var(--primary);outline:none;background:#FFF}
  .table-responsive{overflow-x:auto;width:100%;margin-top:8px;-webkit-overflow-scrolling:touch}
  table.data-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  table.data-table th,table.data-table td{padding:9px;border-bottom:1px solid #EEE;text-align:left}
  table.data-table th{background:#F8F9FA;font-weight:600;color:var(--text-dark)}

  .dynamic-list{margin-bottom:6px}
  .dynamic-row textarea{resize:vertical}
</style>
</head>
<body>

<div class="app-container">

  <!-- LOGIN -->
  <section id="view-login">
    <div class="login-image-container">
      <img src="https://i.imgur.com/9DoQmC7.png" alt="Ilustrasi Belajar">
    </div>
    <h1>Pendidikan<br>29 Karakter Luhur</h1>
    <p>Platform eksklusif untuk membentuk generus yang memiliki 29 karakter luhur.</p>
    <div class="input-group">
      <label>Username</label>
      <input id="loginUser" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="input-group">
      <label>Password</label>
      <input id="loginPass" type="password" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btnLogin" onclick="doLogin()">
      <svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
      Masuk
    </button>
  </section>

  <!-- APP -->
  <section id="view-app" class="hidden">
    <div class="header">
      <div>
        <div class="header-sub" id="headerSub">Selamat Datang</div>
        <div class="header-title" id="userInfo">Memuat...</div>
      </div>
      <button class="avatar-btn" onclick="logout()" title="Keluar">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
    </div>
    <div id="tabContent">
      <div style="text-align:center;padding:40px 0;">
        <div class="spinner"></div>
        <p style="font-size:12px;color:var(--text-gray)">Memuat data...</p>
      </div>
    </div>
    <div class="bottom-nav" id="bottomNav"></div>
  </section>
</div>

<script>
// ============================================================
// ⚙️ KONFIGURASI — GANTI DENGAN URL WEB APP ANDA
// ============================================================
const API_URL = 'https://script.google.com/macros/s/AKfycbxkb8y8why7CV8G66HlPtiFSTXLq6_3CNH1F6QqFYeNr3Iq2y_qpH2IOhOEQ6rYV3AViw/exec';

// ============================================================
// STATE + CACHE
// ============================================================
const cache = {
  get(k){ try{ const v = localStorage.getItem('ss_'+k); if(!v) return null; const o=JSON.parse(v); if(o.exp && o.exp<Date.now()) return null; return o.v; }catch(e){ return null; } },
  set(k,v,ttlMin=5){ try{ localStorage.setItem('ss_'+k, JSON.stringify({v,exp:Date.now()+ttlMin*60000})); }catch(e){} },
  clear(){ Object.keys(localStorage).filter(k=>k.startsWith('ss_')).forEach(k=>localStorage.removeItem(k)); }
};

let state = { user: null, karakter: [], generus: [], evaluasi: [], rekap: null, activeMateri: null };
let editingKarakter = null;
let loading = false;

// ============================================================
// API HELPER (dengan timeout + cache untuk data statis)
// ============================================================
async function api(action, payload = {}, opts = {}) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), opts.timeout || 25000);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
      signal: controller.signal
    });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (err) {
    clearTimeout(timeoutId);
    toast('Koneksi gagal: ' + err.message, true);
    return { success: false, message: err.message };
  }
}

function toast(msg, isError = false) {
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2800);
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toEmbed(url) {
  if (!url) return '';
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : url;
}

// ============================================================
// LOGIN
// ============================================================
async function doLogin() {
  if (loading) return;
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;

  if (!username || !password) { toast('Username & Password wajib diisi', true); return; }

  const btn = document.getElementById('btnLogin');
  loading = true;
  btn.innerHTML = '<div class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></div> Memuat...';
  btn.disabled = true;

  const r = await api('login', { username, password });

  loading = false;
  btn.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg> Masuk';
  btn.disabled = false;

  if (r.success) {
    state.user = r.user;
    document.getElementById('userInfo').textContent = r.user.nama || r.user.username;
    let subText = 'Admin Pusat';
    if (r.user.role === 'kelompok') subText = r.user.kelompok || r.user.lokasi || 'Kelompok';
    if (r.user.role === 'desa') subText = r.user.desa || 'Desa';
    if (r.user.role === 'daerah') subText = r.user.daerah || r.user.lokasi || 'Daerah';
    document.getElementById('headerSub').textContent = subText;
    document.getElementById('view-login').classList.add('hidden');
    document.getElementById('view-app').classList.remove('hidden');
    buildNavigation();

    // ⚡ LOAD DATA PARALEL (bulk)
    await preloadAllData();
    switchTab('materi');
  } else {
    toast(r.message || 'Login gagal', true);
  }
}

document.getElementById('loginPass').addEventListener('keypress', e => { if (e.key === 'Enter') doLogin(); });
document.getElementById('loginUser').addEventListener('keypress', e => { if (e.key === 'Enter') document.getElementById('loginPass').focus(); });

function logout() {
  if (!confirm('Keluar dari akun?')) return;
  state = { user:null, karakter:[], generus:[], evaluasi:[], rekap:null, activeMateri:null };
  editingKarakter = null;
  cache.clear();
  document.getElementById('view-login').classList.remove('hidden');
  document.getElementById('view-app').classList.add('hidden');
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
}

// ============================================================
// ⚡ PRELOAD — ambil semua data sekaligus
// ============================================================
async function preloadAllData() {
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;

  const r = await api('getAllData', p);
  if (r.success) {
    state.karakter = r.karakter || [];
    state.generus  = r.generus  || [];
    state.evaluasi = r.evaluasi || [];
  }
}

async function loadKarakter() {
  const r = await api('getKarakter');
  if (r.success) state.karakter = r.data || [];
}
async function loadGenerus() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  const r = await api('getGenerus', p);
  if (r.success) state.generus = r.data || [];
}
async function loadEvaluasi() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  const r = await api('getEvaluasi', p);
  if (r.success) state.evaluasi = r.data || [];
}
async function loadRekap() {
  if (!state.user) return;
  const p = {};
  if (state.user.role === 'desa')     p.desa     = state.user.desa;
  if (state.user.role === 'daerah')   p.daerah   = state.user.daerah || state.user.lokasi;
  if (state.user.role === 'kelompok') p.kelompok = state.user.kelompok || state.user.lokasi;
  const r = await api('getRekap', p);
  if (r.success) state.rekap = r;
}

// ============================================================
// NAVIGATION
// ============================================================
const ICONS = {
  materi: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
  user:   '<svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
  rekap:  '<svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
  logout: '<svg class="icon" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>',
  arrowRight: '<svg class="arrow-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  arrowLeft:  '<svg class="icon-sm" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>'
};

function buildNavigation() {
  const navDiv = document.getElementById('bottomNav');
  navDiv.innerHTML = '';
  const role = state.user.role;
  let items = [];

  if (role === 'admin') {
    items = [
      { id:'materi',   label:'Materi', icon:ICONS.materi },
      { id:'karakter', label:'Kelola', icon:ICONS.materi },
      { id:'user',     label:'User',   icon:ICONS.user },
      { id:'logout',   label:'Keluar', icon:ICONS.logout }
    ];
  } else if (role === 'kelompok') {
    items = [
      { id:'materi', label:'Materi', icon:ICONS.materi },
      { id:'rekap',  label:'Rekap',  icon:ICONS.rekap },
      { id:'logout', label:'Keluar', icon:ICONS.logout }
    ];
  } else if (role === 'desa' || role === 'daerah') {
    items = [
      { id:'rekap',  label:'Rekap',  icon:ICONS.rekap },
      { id:'materi', label:'Materi', icon:ICONS.materi },
      { id:'logout', label:'Keluar', icon:ICONS.logout }
    ];
  }

  items.forEach(item => {
    const b = document.createElement('button');
    b.innerHTML = `${item.icon}<span>${item.label}</span>`;
    b.dataset.tab = item.id;
    b.onclick = () => switchTab(item.id);
    navDiv.appendChild(b);
  });
}

function switchTab(id) {
  document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  const el = document.getElementById('tabContent');
  el.innerHTML = '<div style="text-align:center;padding:40px 0"><div class="spinner"></div></div>';
  state.activeMateri = null;

  if (id === 'logout') { logout(); return; }

  const map = {
    'materi':   renderMateriPage,
    'karakter': renderAdminKarakter,
    'user':     renderAdminUser,
    'rekap':    renderRekapPage
  };
  const fn = map[id];
  if (fn) fn();
}

function parseDalil(d) {
  if (!d) return { arab:'', arti:'' };
  const parts = String(d).split('\n\n');
  if (parts.length > 1) return { arab: parts[0], arti: parts[1].replace(/^"|"$/g,'') };
  const isArabic = /[\u0600-\u06FF]/.test(d);
  return isArabic ? { arab:d, arti:'' } : { arab:'', arti:d };
}

function renderDalilTable(k) {
  const arr = Array.isArray(k.dalil) ? k.dalil : (k.dalil ? [k.dalil] : []);
  if (!arr.length) return `<p style="font-size:12px;color:var(--text-gray)">Belum ada dalil.</p>`;

  return `
    <div class="dalil-list" id="dalilList">
      ${arr.map((d, i) => {
        const { arab, arti } = parseDalil(d);
        return `
          <div class="dalil-card">
            ${arr.length > 1 ? `<span class="dalil-num">Dalil ${i+1}</span>` : ''}
            ${arab ? `<div class="dalil-arab">${esc(arab)}</div>` : ''}
            ${arab && arti ? `<div class="dalil-divider"></div>` : ''}
            ${arti ? `<div class="dalil-arti">${esc(arti)}</div>` : ''}
          </div>`;
      }).join('')}
    </div>`;
}

function changeFontSize(delta) {
  const list = document.getElementById('dalilList');
  if (!list) return;
  list.querySelectorAll('.dalil-arab').forEach(el => {
    const cur = parseFloat(window.getComputedStyle(el).fontSize);
    el.style.fontSize = Math.max(14, Math.min(38, cur + delta)) + 'px';
  });
}

function renderPraktikTable(k) {
  const salah = k.contoh_salah || [];
  const benar = k.contoh_benar || [];
  const n = Math.max(salah.length, benar.length);
  if (!n) return `<table class="praktik-table"><tr><th>❌ Salah</th><th>✅ Benar</th></tr><tr><td colspan="2" style="text-align:center;color:var(--text-gray)">Belum ada contoh</td></tr></table>`;
  return `<table class="praktik-table">
    <tr><th>❌ Salah</th><th>✅ Benar</th></tr>
    ${Array.from({length:n}).map((_,i)=>`<tr><td class="salah">${esc(salah[i]||'')}</td><td class="benar">${esc(benar[i]||'')}</td></tr>`).join('')}
  </table>`;
}

function renderKesimpulan() {
  return `
    <div style="font-size:12px;color:var(--text-dark);line-height:1.6">
      <p style="margin-bottom:8px">Generus melakukan penilaian diri dengan menuliskan hal-hal yang perlu diperbaiki dan langkah-langkah komitmen.</p>
      <textarea class="form-control" style="margin-top:10px;background:#FFF;border-color:#DDD;font-size:12px" rows="4" placeholder="Tuliskan komitmen & penilaian dirimu..."></textarea>
      <button class="btn-primary" style="padding:10px;font-size:12px" onclick="toast('Komitmen berhasil disimpan!')">Simpan Komitmen</button>
    </div>`;
}

function renderEvalList(karakterId) {
  const jenjang = document.getElementById(`jenjang_${karakterId}`).value;
  const container = document.getElementById(`eval_list_${karakterId}`);
  if (!jenjang) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-gray);text-align:center;padding:10px 0">Pilih jenjang untuk melihat daftar nama.</p>';
    return;
  }
  const list = state.generus.filter(g => g.jenjang === jenjang);
  if (!list.length) {
    container.innerHTML = '<p style="font-size:12px;color:var(--danger);text-align:center;padding:10px 0">Tidak ada generus di jenjang ini.</p>';
    return;
  }
  let html = '';
  list.forEach(g => {
    const ev = state.evaluasi.find(e => String(e.karakter_id)===String(karakterId) && String(e.generus_nama)===String(g.nama));
    const status = ev ? ev.status : 'Belum';
    const encodedNama = encodeURIComponent(g.nama);
    html += `
      <div class="eval-item">
        <span class="name">${esc(g.nama)}</span>
        <div class="actions">
          <button class="btn-sm ${status==='Sudah'?'btn-sudah':'btn-outline'}" onclick="setStatus('${karakterId}',decodeURIComponent('${encodedNama}'),'Sudah')">${status==='Sudah'?'✓ Sudah':'Sudah'}</button>
          <button class="btn-sm ${status==='Belum'?'btn-belum':'btn-outline'}" onclick="setStatus('${karakterId}',decodeURIComponent('${encodedNama}'),'Belum')">${status==='Belum'?'✗ Belum':'Belum'}</button>
        </div>
      </div>`;
  });
  container.innerHTML = html;
}

async function setStatus(karakter_id, nama, status) {
  const g = state.generus.find(x => x.nama === nama);
  if (!g) return;
  const payload = {
    karakter_id, generus_nama:nama, jenjang:g.jenjang,
    kelompok:g.kelompok, desa:g.desa, daerah:'',
    status, catatan:'', oleh:state.user.username
  };
  const r = await api('saveEvaluasi', payload);
  if (r.success) {
    toast(`${nama}: ${status}`);
    // update state lokal tanpa fetch ulang
    const idx = state.evaluasi.findIndex(e => String(e.karakter_id)===String(karakter_id) && String(e.generus_nama)===String(nama));
    if (idx >= 0) state.evaluasi[idx].status = status;
    else state.evaluasi.push({ karakter_id, generus_nama:nama, status, jenjang:g.jenjang, kelompok:g.kelompok, desa:g.desa });
    const selectEl = document.getElementById(`jenjang_${karakter_id}`);
    if (selectEl) renderEvalList(karakter_id);
  } else toast(r.message, true);
}

function editKarakter(id) {

function showKarakterForm(k = null) {
  editingKarakter = k;
  const isEdit = !!k;
  const data = k || { judul:'', pengertian:'', dalil:[], video_url:'', contoh_salah:[], contoh_benar:[], refleksi:'', afirmasi:'', urutan: state.karakter.length+1 };

  const container = document.getElementById('karakterFormContainer');
  container.innerHTML = `
    <div class="white-card" style="border:2px solid var(--primary)">
      <h4>${isEdit?'✏️ Edit Karakter':'➕ Tambah Karakter Baru'}</h4>
      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Judul</label>

      <button class="btn-sm btn-outline" style="margin-bottom:10px" onclick="addDalilRow()">+ Tambah Dalil</button>
      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Contoh Praktik (Salah ↔ Benar)</label>
      <div id="contohList" class="dynamic-list"></div>
      <button class="btn-sm btn-outline" style="margin-bottom:10px" onclick="addContohRow()">+ Tambah Baris Contoh</button>
      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Refleksi</label>
      <textarea id="f_refleksi" class="form-control" rows="3" placeholder="Pertanyaan refleksi...">${esc(data.refleksi)}</textarea>
      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Afirmasi</label>
      <input id="f_afirmasi" class="form-control" value="${esc(data.afirmasi)}" placeholder="Insya Alloh saya mampu...">
      <label style="font-size:11px;font-weight:600;margin-bottom:4px;display:block">Urutan</label>
      <input id="f_urutan" type="number" class="form-control" value="${data.urutan||1}">

        <button class="btn-primary" style="flex:1" onclick="saveKarakterSubmit(${isEdit?`'${k.id}'`:'null'})">${isEdit?'💾 Simpan Perubahan':'💾 Simpan'}</button>
        <button class="btn-primary" style="flex:0 0 auto;background:#EEE;color:var(--text-dark);box-shadow:none" onclick="cancelKarakterForm()">Batal</button>
      </div>
    </div>`;

  const dalilArr = data.dalil && data.dalil.length ? data.dalil : [''];
  dalilArr.forEach(d => addDalilRow(d));

  const salahArr = data.contoh_salah || [];
  const benarArr = data.contoh_benar || [];
  const rowCount = Math.max(salahArr.length, benarArr.length, 1);
  for (let i = 0; i < rowCount; i++) addContohRow(salahArr[i]||'', benarArr[i]||'');

  container.scrollIntoView({ behavior:'smooth', block:'start' });
}

function cancelKarakterForm() {
  document.getElementById('karakterFormContainer').innerHTML = '';
  editingKarakter = null;
}

function addDalilRow(value = '') {
  const list = document.getElementById('dalilList');
  if (!list) return;
  const idx = list.children.length;
  const div = document.createElement('div');
  div.className = 'dynamic-row';
  div.style.cssText = 'display:flex;gap:6px;margin-bottom:6px';
  div.innerHTML = `
    <textarea class="form-control dalil-input" rows="4" style="flex:1;margin-bottom:0" placeholder="Dalil ${idx+1}. Teks Arab, ENTER 2x, lalu artinya.">${esc(value)}</textarea>
    <button class="btn-sm btn-belum" style="padding:6px 10px" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

function addContohRow(salah = '', benar = '') {
  const list = document.getElementById('contohList');
  if (!list) return;
  const div = document.createElement('div');
  div.className = 'dynamic-row';
  div.style.cssText = 'display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-bottom:6px';
  div.innerHTML = `
    <textarea class="form-control contoh-salah" rows="2" style="margin-bottom:0;font-size:12px" placeholder="❌ Salah...">${esc(salah)}</textarea>
    <textarea class="form-control contoh-benar" rows="2" style="margin-bottom:0;font-size:12px" placeholder="✅ Benar...">${esc(benar)}</textarea>
    <button class="btn-sm btn-belum" style="padding:6px 10px" onclick="this.parentElement.remove()">✕</button>`;
  list.appendChild(div);
}

async function saveKarakterSubmit(id) {
  const judul = document.getElementById('f_judul').value.trim();
  if (!judul) { toast('Judul wajib diisi', true); return; }

  const dalil = Array.from(document.querySelectorAll('.dalil-input')).map(t=>t.value.trim()).filter(v=>v);
  const contohSalah = Array.from(document.querySelectorAll('.contoh-salah')).map(t=>t.value.trim());
  const contohBenar = Array.from(document.querySelectorAll('.contoh-benar')).map(t=>t.value.trim());

  const payload = {
    id: id || undefined,
    judul,
    pengertian: document.getElementById('f_pengertian').value.trim(),
    video_url: document.getElementById('f_video').value.trim(),
    dalil, contoh_salah:contohSalah, contoh_benar:contohBenar,
    refleksi: document.getElementById('f_refleksi').value.trim(),
    afirmasi: document.getElementById('f_afirmasi').value.trim(),
    urutan: Number(document.getElementById('f_urutan').value) || 1
  };

  const r = await api('saveKarakterForm', payload);
  if (r.success) {
    toast(r.message);
    await loadKarakter();
    document.getElementById('karakterFormContainer').innerHTML = '';
    renderKarakterList();
  } else toast(r.message, true);
}

async function hapusKarakter(id) {
  if (!confirm('Hapus materi ini?')) return;
  const r = await api('deleteKarakter', { id });
  if (r.success) {
    toast(r.message);
    await loadKarakter();
    renderKarakterList();
  } else toast(r.message, true);
}

}

function editUser(u) {
  document.getElementById('u_username').value = u.username || '';
  document.getElementById('u_password').value = '';
  document.getElementById('u_role').value = (u.role||'').toLowerCase() || 'kelompok';
  document.getElementById('u_lokasi').value = u.lokasi || '';
  document.getElementById('u_desa').value = u.desa || '';
  document.getElementById('tabContent').scrollTop = 0;
}

async function saveUser() {
  const payload = {
    username: document.getElementById('u_username').value.trim(),
    password: document.getElementById('u_password').value,
    role: document.getElementById('u_role').value,
    lokasi: document.getElementById('u_lokasi').value,
    desa: document.getElementById('u_desa').value
  };
  if (!payload.username) { toast('Username wajib', true); return; }
  const r = await api('saveUser', payload);
  if (r.success) { toast(r.message); renderAdminUser(); }
  else toast(r.message, true);
}

async function hapusUser(username) {
  if (!confirm('Hapus user ' + username + '?')) return;
  const r = await api('deleteUser', { username });
  if (r.success) { toast(r.message); renderAdminUser(); }
  else toast(r.message, true);
}

// ============================================================
// REKAP PAGE
// ============================================================
async function renderRekapPage() {
  await loadRekap();
  const el = document.getElementById('tabContent');
  if (!state.rekap) { el.innerHTML = '<div class="white-card"><p>Gagal memuat rekap.</p></div>'; return; }

  const r = state.rekap.rekap || {};
  const scope = state.user.role === 'desa' ? 'Desa' : (state.user.role === 'daerah' ? 'Daerah' : 'Kelompok');
  const userScope = state.user[scope.toLowerCase()] || state.user.lokasi || state.user.nama;

  el.innerHTML = `
    <div class="course-card" style="background:linear-gradient(135deg,#00D2FF 0%,#0084C7 100%)">
      <div class="tag">${scope}</div>
      <h3>${esc(userScope)}</h3>
      <div style="margin-top:12px;gap:24px;display:flex">
        <div><div style="font-size:24px;font-weight:700">${state.rekap.totalGenerus}</div><div style="font-size:10px;opacity:.8">Total Generus</div></div>
        <div><div style="font-size:24px;font-weight:700">${state.rekap.totalEvaluasi||0}</div><div style="font-size:10px;opacity:.8">Evaluasi Masuk</div></div>
      </div>
    </div>
    <div class="white-card">
      <h4>Pencapaian Karakter</h4>
      ${Object.entries(r).map(([id,k])=>`
        <div style="margin-bottom:14px">
          <div style="display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px">
            <span>${esc(k.judul)}</span>
            <span style="color:var(--primary)">${k.persen}%</span>
          </div>
          <div class="progress-bar"><div class="progress-fill" style="width:${k.persen}%"></div></div>
          <div style="font-size:10px;color:var(--text-gray);margin-top:4px">${k.sudah} dari ${k.total} anak sudah</div>
        </div>`).join('')}
    </div>
    <div class="white-card">
      <h4>Sebaran Jenjang</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
        ${Object.entries(state.rekap.perJenjang||{}).map(([j,v])=>`
          <div style="background:#F8F9FA;padding:11px;border-radius:12px;text-align:center">
            <div style="font-size:18px;font-weight:700;color:var(--primary)">${v.total}</div>
            <div style="font-size:11px;color:var(--text-gray)">${esc(j)}</div>
          </div>`).join('')}
      </div>
    </div>`;
}
